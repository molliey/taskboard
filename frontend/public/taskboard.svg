<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="taskboardGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="32" height="32" rx="6" fill="url(#taskboardGradient)"/>
  
  <!-- Kanban columns representation -->
  <rect x="4" y="8" width="6" height="16" rx="1" fill="white" opacity="0.9"/>
  <rect x="13" y="8" width="6" height="16" rx="1" fill="white" opacity="0.7"/>
  <rect x="22" y="8" width="6" height="16" rx="1" fill="white" opacity="0.5"/>
  
  <!-- Task cards -->
  <rect x="5" y="10" width="4" height="2" rx="0.5" fill="#3b82f6"/>
  <rect x="5" y="13" width="4" height="2" rx="0.5" fill="#3b82f6"/>
  <rect x="14" y="10" width="4" height="2" rx="0.5" fill="#1d4ed8"/>
  <rect x="23" y="18" width="4" height="2" rx="0.5" fill="#1e40af"/>
</svg>